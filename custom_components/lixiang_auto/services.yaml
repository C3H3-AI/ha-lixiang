wakeup:
  name: 唤醒车辆
  description: 唤醒处于休眠状态的车辆（远程唤醒，耗电较低）。
  fields:
    vin:
      name: VIN
      description: 目标车辆 VIN（可选，默认使用配置的车辆）
      required: false
      selector:
        text:

refresh:
  name: 立即刷新
  description: 立即拉取一次车辆最新状态（不等下一个轮询周期）。
  fields:
    vin:
      name: VIN
      description: 目标车辆 VIN（可选，默认使用配置的车辆）
      required: false
      selector:
        text:

dump_ability:
  name: 导出车型能力表
  description: >-
    把当前车型的能力表（来自官方 App 内置的配置，含座椅/温控能力与 45 项功能开关）
    导出为 JSON 文件，用于排查实体缺失或反馈新车型支持。
    文件路径：<config>/lixiang_ability_<modelId>.json
  fields:
    vin:
      name: VIN
      description: 目标车辆 VIN（可选，默认使用配置的车辆）
      required: false
      selector:
        text:

get_travel:
  name: 查询行程/陪伴里程
  description: >-
    查询车辆的行程里程数据（逆向自官方 App 的 travel 接口）。
    三种用法（三选一）：
      · 不传参数 → 各月里程汇总
      · year + month → 单月详情（含每日明细）
      · start_date + end_date → 时间段汇总
  fields:
    vin:
      name: VIN
      description: 目标车辆 VIN（可选，默认使用配置的车辆）
      required: false
      selector:
        text:
    year:
      name: 年
      description: 单月查询的年份（如 2026），需与 month 一起使用
      required: false
      selector:
        number:
          min: 2019
          max: 2100
    month:
      name: 月
      description: 单月查询的月份（1-12），需与 year 一起使用
      required: false
      selector:
        number:
          min: 1
          max: 12
    start_date:
      name: 开始日期
      description: 时间段查询的开始日期（YYYY-MM-DD），需与 end_date 一起使用
      required: false
      selector:
        text:
    end_date:
      name: 结束日期
      description: 时间段查询的结束日期（YYYY-MM-DD），需与 start_date 一起使用
      required: false
      selector:
        text:

get_charge:
  name: 查询充电记录
  description: >-
    查询车辆的充电记录（逆向自官方 App 的 bsp-vcp-message 接口）。
    两种用法：
      · 不传参数 → 按月统计（充电次数 + 总电量）
      · dt ("年-月") + charging_type → 某月明细
  fields:
    vin:
      name: VIN
      description: 目标车辆 VIN（可选，默认使用配置的车辆）
      required: false
      selector:
        text:
    dt:
      name: 年月
      description: 查询的年月，格式 "2026-9"（年-月）
      required: false
      selector:
        text:
    charging_type:
      name: 充电类型
      description: >-
        1=直流(DC)，2=交流(AC)，3=5C超充，4=理想超充(4C/5C)；
        不填 / 0 / all = 聚合全部 4 种类型（推荐，与 App 明细页一致）。默认聚合。
      required: false
      selector:
        number:
          min: 0
          max: 4

get_svm_photo:
  name: 查询驻车照片
  description: >-
    获取 360 驻车照片（SVM）的签名 URL。链路：读 VSS 拍照时间 → 按模板构造
    5 路 OSS key（前/后/左/右/顶）→ 调 OIS 接口换签名 URL。
    返回 {vin: {photo_time, urls}}，urls 可直接用于 <img src>。
  fields:
    vin:
      name: VIN
      description: 多车时指定目标车辆；留空则对所有条目执行
      required: false
      example: HLX32XXXXXXXXXXXX
      selector:
        text:
    time:
      name: 拍照时间
      description: >-
        拍照时间，格式 "YYYY-MM-DD HH:MM:SS"。留空则用集成当前状态里
        的拍照时间（VSS Vehicle.360Svm.Park.Filekey 的 picTime）。
      required: false
      example: "2026-10-03 11:46:24"
      selector:
        text:
    angles:
      name: 方位
      description: 只取部分方位，可选 Front / Rear / Left / Right / Top；留空取全部 5 路
      required: false
      example: '["Front", "Rear"]'
      selector:
        object:

create_task:
  name: 创建任务大师任务
  description: >-
    创建一个「任务大师」自动化任务（HTTP /ssp-task-master-service，
    2026-10-07 真机抓包实证的字段结构）。conditions/actions 传字典数组；
    条件/动作类型可参考集成内「任务大师」传感器属性，或 App 内任务编辑页。
    成功后任务列表传感器与开关会立即刷新。
  fields:
    vin:
      name: VIN
      description: 多车时指定目标车辆；留空则对所有条目执行
      required: false
      selector:
        text:
    name:
      name: 任务名称
      description: 任务名（必填，如 "上车自动关窗"）
      required: true
      example: 麦克风连接时开插座
      selector:
        text:
    conditions:
      name: 条件
      description: >-
        条件数组（可选，省略=无条件常开）。元素形如
        {"conditionType":"Microphone","params":[{"key":"state","value":"connected"}]}
      required: false
      example: '[{"conditionType": "Microphone", "params": [{"key": "state", "value": "connected"}]}]'
      selector:
        object:
    actions:
      name: 动作
      description: >-
        动作数组（必填，至少一个）。元素形如
        {"actionType":"PowerOutlet","params":[{"key":"operation","value":"open"}]}
      required: true
      example: '[{"actionType": "PowerOutlet", "params": [{"key": "operation", "value": "open"}]}]'
      selector:
        object:
    automate:
      name: 自动执行
      description: 无条件自动运行（默认 true）
      required: false
      default: true
      selector:
        boolean:
    voice_execute:
      name: 语音可执行
      description: 是否可被语音助手触发（默认 false）
      required: false
      default: false
      selector:
        boolean:
    run_once:
      name: 只运行一次
      description: 触发一次后自动停用（默认 false）
      required: false
      default: false
      selector:
        boolean:
    enabled:
      name: 启用
      description: 创建后是否立即启用（默认 true）
      required: false
      default: true
      selector:
        boolean:

get_tasks:
  name: 查询任务大师列表
  description: >-
    按需拉取任务大师完整列表（含每个任务的条件/动作 taskValue），
    以服务响应形式返回，用于脚本/自动化里获取 config_id 或做条件判断。
  fields:
    vin:
      name: VIN
      description: 多车时指定目标车辆；留空则查询所有条目
      required: false
      selector:
        text:

update_task:
  name: 更新任务大师任务
  description: >-
    按 config_id 更新已有任务。先拉取线上最新版本再合并覆盖字段
    （不传的字段保持原值），避免旧缓存回写。conditions/actions 传字典数组。
    成功后任务列表传感器与开关立即刷新。
  fields:
    vin:
      name: VIN
      description: 多车时指定目标车辆；留空则对所有条目执行
      required: false
      selector:
        text:
    config_id:
      name: 任务ID
      description: 目标任务的 configId（如 mob_1791366893482），来自传感器属性或 get_tasks
      required: true
      example: mob_1791366893482
      selector:
        text:
    name:
      name: 任务名称
      description: 修改任务名（不传=不改）
      required: false
      selector:
        text:
    conditions:
      name: 条件
      description: 整体替换条件数组（不传=不改）
      required: false
      selector:
        object:
    actions:
      name: 动作
      description: 整体替换动作数组（不传=不改）
      required: false
      selector:
        object:
    automate:
      name: 自动执行
      description: 是否自动运行（不传=不改）
      required: false
      selector:
        boolean:
    voice_execute:
      name: 语音可执行
      description: 是否可被语音助手触发（不传=不改）
      required: false
      selector:
        boolean:
    run_once:
      name: 只运行一次
      description: 触发一次后自动停用（不传=不改）
      required: false
      selector:
        boolean:
    enabled:
      name: 启用
      description: 任务启停（不传=不改；也可用任务开关实体）
      required: false
      selector:
        boolean:

delete_task:
  name: 删除任务大师任务
  description: 按 config_id 删除任务（与 App 删除行为一致），成功后开关实体转为不可用。
  fields:
    vin:
      name: VIN
      description: 多车时指定目标车辆；留空则对所有条目执行
      required: false
      selector:
        text:
    config_id:
      name: 任务ID
      description: 目标任务的 configId（来自传感器属性或 get_tasks）
      required: true
      example: mob_1791366893482
      selector:
        text:

dump_realtime_state:
  name: 诊断 real-time-state（老平台车型实时通道）
  description: >-
    探测老平台车型（如理想ONE / M01）的实时状态通道
    `/ssp-as-mobile-api/v3-0/vehicles/{vin}/real-time-state`，并把**原始响应**
    导出为 JSON 文件，用于补齐这些车型的字段映射。
    同时会打一条已知可用的接口作**对照组**（travel 月里程），
    以便区分「该端点不可用」与「会话/权限/签名问题」。
    只读，不会触发任何车控。文件路径：<config>/lixiang_realtime_state_<vin>.json
  fields:
    vin:
      name: VIN
      description: 只处理该 VIN 的条目（留空 = 全部）
      required: false
      example: LW433B111M1027177
      selector:
        text:
